name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: black --check .

      # The suite is offline: Mongo is mongomock, S3 and IMDB are mocks, so no
      # secret or Playwright browser is needed here.
      - name: Run tests
        run: python -m pytest
